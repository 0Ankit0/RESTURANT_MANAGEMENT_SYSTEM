services:
  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["80:80", "443:443"]
    depends_on: [web, api]

  web:
    image: ghcr.io/example/restaurant-web:latest
    restart: unless-stopped
    env_file: [../frontend/.env.production]

  api:
    image: ghcr.io/example/restaurant-api:latest
    restart: unless-stopped
    env_file: [../backend/.env.production]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/ready/"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on: [postgres, redis, minio]

  worker:
    image: ghcr.io/example/restaurant-api:latest
    restart: unless-stopped
    command: uv run celery -A src.apps.core.celery_app worker --loglevel=info
    env_file: [../backend/.env.production]
    depends_on: [api]

  scheduler:
    image: ghcr.io/example/restaurant-api:latest
    restart: unless-stopped
    command: uv run celery -A src.apps.core.celery_app beat --loglevel=info
    env_file: [../backend/.env.production]
    depends_on: [api]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [../backend/.env.production]
    volumes: ["postgres_prod:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: [../backend/.env.production]
    volumes: ["minio_prod:/data"]

volumes:
  postgres_prod:
  minio_prod:
