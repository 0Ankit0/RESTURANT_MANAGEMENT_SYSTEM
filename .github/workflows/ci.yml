name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation
        run: python3 scripts/validate_documentation.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: uv sync --frozen --group dev --group test
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run --group test pytest
      - name: Workflow scenario gates
        run: |
          uv run --group test pytest tests/integration/api/test_restaurant_operations.py::test_release_workflow_gate_scenarios
          uv run --group test pytest tests/integration/api/test_release_readiness_gates.py::test_e2e_seat_to_settlement_and_security_audits

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Workflow scenario gates
        run: npm run test:workflow
      - name: Build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage
      - name: Workflow scenario gates
        run: flutter test test/restaurant_page_widget_test.dart test/payment_and_notifications_flow_test.dart
      - name: Coverage threshold
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('coverage/lcov.info').read_text()
          lf = sum(int(x) for x in re.findall(r'LF:(\d+)', text))
          lh = sum(int(x) for x in re.findall(r'LH:(\d+)', text))
          pct = (lh / lf * 100) if lf else 0
          print(f'coverage={pct:.2f}% ({lh}/{lf})')
          assert pct >= 25, f'Mobile coverage below threshold: {pct:.2f}% < 25%'
          PY

  docker-build:
    runs-on: ubuntu-latest
    needs: [docs, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t restaurant-backend:ci backend
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t restaurant-frontend:ci frontend
